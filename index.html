            {
                let parent = targetElement.parentNode
                if ( parent.lastChild == targetElement )

                    parent.appendChild( newElement )

            // ============================================================
            //  RC-Adsense  —— 重写：绝对保证弹层层级最高、全屏居中、可关闭
            // ============================================================
            function o_rcAd ( node, ad, lc )
            {
                /* ---- 1. 阻止页面滚动 ---- */
                let prevOverflow = document.documentElement.style.overflow
                document.documentElement.style.overflow = 'hidden'

                /* ---- 2. 遮罩层（overlay）---- */
                let overlay = document.createElement( 'div' )
                overlay.id = 'onemob-overlay'

                // 用 style 标签注入关键帧，保证动画可用
                let styleEl = document.createElement( 'style' )
                styleEl.textContent = [
                    '@keyframes _om_fadein{from{opacity:0}to{opacity:1}}',
                    '@keyframes _om_scalein{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}'
                ].join( '' )
                document.head.appendChild( styleEl )

                // 遮罩：铺满视口，层级 2147483647（CSS 最大值）
                Object.assign( overlay.style, {
                    position:        'fixed',
                    inset:           '0',           // top/right/bottom/left = 0
                    top:             '0',
                    left:            '0',
                    right:           '0',
                    bottom:          '0',
                    width:           '100%',
                    height:          '100%',
                    background:      'rgba(0,0,0,0.75)',
                    zIndex:          '2147483647',
                    display:         'flex',
                    alignItems:      'center',
                    justifyContent:  'center',
                    animation:       '_om_fadein 0.25s ease both',
                    boxSizing:       'border-box',
                    padding:         '0',
                    margin:          '0',
                    border:          'none',
                    outline:         'none',
                    pointerEvents:   'all',
                    // 修正 iOS Safari：fixed 定位失效时的兜底
                    WebkitOverflowScrolling: 'touch',
                })

                // 把遮罩挂到 <html>（不是 body），避免 body 的 transform 影响 fixed 定位
                document.documentElement.appendChild( overlay )

                /* ---- 3. 关闭函数（供按钮 & 点击遮罩使用）---- */
                function closeOverlay ()
                {
                    document.documentElement.style.overflow = prevOverflow
                    styleEl.remove()
                    if ( overlay.parentNode ) overlay.parentNode.removeChild( overlay )
                }

                /* ---- 4. 点击遮罩背景关闭（点广告内容区不关闭）---- */
                overlay.addEventListener( 'click', function ( e )
                {
                    if ( e.target === overlay ) closeOverlay()
                } )

                /* ---- 5. ESC 键关闭 ---- */
                function onKeyDown ( e )
                {
                    if ( e.key === 'Escape' || e.keyCode === 27 )
                    {
                        document.removeEventListener( 'keydown', onKeyDown )
                        closeOverlay()
                    }
                }
                document.addEventListener( 'keydown', onKeyDown )

                /* ---- 6. 广告容器（wrapper）---- */
                let wrapper = document.createElement( 'div' )
                Object.assign( wrapper.style, {
                    position:      'relative',
                    width:         'auto',
                    background:    '#fff',
                    borderRadius:  '8px',
                    overflow:      'visible',       // 让关闭按钮可以超出
                    boxShadow:     '0 8px 40px rgba(0,0,0,0.45)',
                    animation:     '_om_scalein 0.28s cubic-bezier(.22,.61,.36,1) both',
                    // 阻止点击穿透到遮罩
                    pointerEvents: 'all',
                } )

                /* 阻止 wrapper 上的点击冒泡到 overlay（避免误关闭） */
                wrapper.addEventListener( 'click', function ( e ) { e.stopPropagation() } )

                overlay.appendChild( wrapper )

                /* ---- 7. 关闭按钮（定位在 wrapper 右上角外侧）---- */
                let closeBtn = document.createElement( 'button' )
                closeBtn.setAttribute( 'aria-label', 'Close' )
                closeBtn.textContent = '✕'
                Object.assign( closeBtn.style, {
                    position:     'absolute',
                    top:          '-16px',
                    right:        '-16px',
                    width:        '36px',
                    height:       '36px',
                    background:   '#ffffff',

                    borderRadius: '50%',
                    display:      'flex',
                    alignItems:   'center',
                    justifyContent: 'center',
                    cursor:       'pointer',
                    fontSize:     '16px',
                    fontWeight:   'bold',
                    color:        '#333333',
                    lineHeight:   '1',
                    zIndex:       '1',              // 相对 wrapper 置顶
                    boxShadow:    '0 2px 8px rgba(0,0,0,0.18)',
                    padding:      '0',
                    outline:      'none',
                    transition:   'background 0.15s, color 0.15s',
                    boxSizing:    'border-box',
                } )
                closeBtn.addEventListener( 'mouseover', function ()
                {
                    closeBtn.style.background = '#f44336'
                    closeBtn.style.color      = '#ffffff'
                    closeBtn.style.borderColor = '#f44336'
                } )
                closeBtn.addEventListener( 'mouseout', function ()
                {
                    closeBtn.style.background  = '#ffffff'
                    closeBtn.style.color       = '#333333'
                    closeBtn.style.borderColor = '#e0e0e0'
                } )
                closeBtn.addEventListener( 'click', function ( e )
                {
                    e.stopPropagation()
                    document.removeEventListener( 'keydown', onKeyDown )
                    closeOverlay()
                } )
                wrapper.appendChild( closeBtn )

                ins.setAttribute( 'class', 'adsbygoogle' )
                ins.setAttribute( 'style', 'display:block;border-radius:8px;overflow:hidden;' )
                ins.setAttribute( 'data-ad-client',             'ca-pub-2894714012965030' )
                ins.setAttribute( 'data-ad-slot',               '4445597105' )
                ins.setAttribute( 'data-ad-format',             'auto' )

                wrapper.appendChild( ins )

                script2.text = '(adsbygoogle = window.adsbygoogle || []).push({});'
                wrapper.appendChild( script2 )

            function o_getProperties ()
            {
                let sh = window.screen.height
                let sw = window.screen.width
                let vh = window.visualViewport ? window.visualViewport.height : window.innerHeight
                let vw = window.visualViewport ? window.visualViewport.width  : window.innerWidth
                let dpr = window.devicePixelRatio
                let pf = navigator.platform
                let ua = encodeURIComponent( navigator.userAgent )
                let core = navigator.hardwareConcurrency || ''
                let mem = navigator.deviceMemory || ''
                let langs = navigator.languages
                let glv = ""
                let glr = ""
                let canvas = document.createElement( 'canvas' )
                canvas.id = 'webglCanvas'
                canvas.width = 1
                canvas.height = 1
                canvas.style.display = 'none'
                document.body.appendChild( canvas )
                let gl = canvas.getContext( 'webgl' ) || canvas.getContext( 'experimental-webgl' )
                if ( gl )
                {
                    let debugInfo = gl.getExtension( 'WEBGL_debug_renderer_info' )
                    if ( debugInfo )
                    {
                        glv = gl.getParameter( debugInfo.UNMASKED_VENDOR_WEBGL )
                        glr = gl.getParameter( debugInfo.UNMASKED_RENDERER_WEBGL )
                    }
                }
                return '&sh=' + sh + '&sw=' + sw + '&vh=' + vh + '&vw=' + vw + '&dpr=' + dpr + '&pf=' + pf + '&core=' + core + '&mem=' + mem + '&langs=' + encodeURIComponent( langs ) + '&glv=' + encodeURIComponent( glv ) + '&glr=' + encodeURIComponent( glr )

            function o_browserRedirect ()

            function o_getQueryVariable ( variable )
            {
                let query = window.location.search.substring( 1 )
                let vars = query.split( "&" )
                for ( let i = 0; i < vars.length; i++ )
                {
                    let pair = vars[i].split( "=" )
                    if ( pair[0] == variable ) { return pair[1] }
                }
                return ( false )

                requestLC.open( 'GET', url, true )

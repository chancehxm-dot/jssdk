<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Onemob SDK 本地测试</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            color: #172033;
            background: #f5f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px;
        }

        main {
            max-width: 960px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
            line-height: 1.25;
        }

        p {
            margin: 0;
            color: #5f6b7a;
            line-height: 1.6;
        }

        .panel {
            margin-top: 24px;
            padding: 20px;
            border: 1px solid #dce3ef;
            border-radius: 8px;
            background: #fff;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 16px;
        }

        a,
        button {
            min-height: 44px;
            padding: 0 16px;
            border: 1px solid #2d6cdf;
            border-radius: 6px;
            background: #2d6cdf;
            color: #fff;
            font: inherit;
            font-weight: 600;
            line-height: 42px;
            text-decoration: none;
            cursor: pointer;
        }

        a.secondary,
        button.secondary {
            background: #fff;
            color: #2d6cdf;
        }

        dl {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 10px 16px;
            margin: 16px 0 0;
        }

        dt {
            color: #5f6b7a;
        }

        dd {
            margin: 0;
            font-family: Consolas, monospace;
            word-break: break-all;
        }

        #ONEMOB-sohu300x250 {
            min-height: 80px;
            margin-top: 16px;
            border: 1px dashed #9aa8bb;
            border-radius: 8px;
            background: #f8fafc;
        }

        pre {
            min-height: 160px;
            margin: 16px 0 0;
            padding: 14px;
            overflow: auto;
            border-radius: 6px;
            background: #101827;
            color: #d8e3f8;
            font-size: 13px;
            line-height: 1.5;
        }

        @media (max-width: 640px) {
            body {
                padding: 20px;
            }

            dl {
                grid-template-columns: 1fr;
            }

            a,
            button {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Onemob SDK 本地测试</h1>
        <p>这个页面模拟用户植入 SDK。点击下面入口会带上约定参数重新加载页面，SDK 应该自动插入对应广告 DOM。</p>

        <section class="panel" aria-label="测试入口">
            <strong>参数入口</strong>
            <div class="actions">
                <a href="/index.html?_t_=rb">测试 rb</a>
                <a href="/index.html?_t_=rc" class="secondary">测试 rc</a>
                <a href="/index.html?_f_=1" class="secondary">测试 b6mm</a>
                <a href="/index.html" class="secondary">清空参数</a>
            </div>

            <dl>
                <dt>当前 URL</dt>
                <dd id="current-url"></dd>
                <dt>_t_ 参数</dt>
                <dd id="current-t"></dd>
                <dt>容器 ID</dt>
                <dd>ONEMOB-sohu300x250</dd>
                <dt>检测结果</dt>
                <dd id="detect-result">等待 SDK 执行</dd>
            </dl>
        </section>

        <section class="panel" aria-label="SDK容器">
            <strong>用户页面预留容器</strong>
            <div id="ONEMOB-sohu300x250"></div>
        </section>

        <section class="panel" aria-label="DOM变化日志">
            <strong>DOM 变化日志</strong>
            <pre id="log"></pre>
        </section>
    </main>

    <script>
        ( function ()
        {
            var params = new URLSearchParams( window.location.search )
            var logNode = document.getElementById( 'log' )
            var resultNode = document.getElementById( 'detect-result' )

            document.getElementById( 'current-url' ).textContent = window.location.href
            document.getElementById( 'current-t' ).textContent = params.get( '_t_' ) || '(无)'

            function log ( msg )
            {
                var time = new Date().toLocaleTimeString()
                logNode.textContent += '[' + time + '] ' + msg + '\n'
            }

            function detect ()
            {
                var rbMask = document.getElementById( 'onemob-rb-mask' )
                var rbWrap = document.getElementById( 'onemob-rb-wrap' )
                var ad = document.getElementById( 'onemob-ad' )
                var adsense = document.querySelector( '.adsbygoogle' )

                if ( rbMask || rbWrap )
                {
                    resultNode.textContent = '已检测到 rb 弹层 DOM'
                    return
                }

                if ( ad || adsense )
                {
                    resultNode.textContent = '已检测到广告 DOM'
                    return
                }

                resultNode.textContent = '暂未检测到广告 DOM'
            }

            var observer = new MutationObserver( function ( mutations )
            {
                mutations.forEach( function ( item )
                {
                    Array.prototype.forEach.call( item.addedNodes, function ( node )
                    {
                        if ( node.nodeType != 1 ) return
                        log( '新增节点：<' + node.tagName.toLowerCase() + '> id="' + ( node.id || '' ) + '" class="' + ( node.className || '' ) + '"' )
                    } )
                } )
                detect()
            } )

            observer.observe( document.documentElement, { childList: true, subtree: true } )
            log( '开始监听 DOM，随后加载 SDK' )
            window.__onemobDetect = detect
            window.__onemobLog = log
        } )()
    </script>
    <script src="/sohu300x250.js?v=rb-test"></script>
     <!-- <script src="/libs/collet-data.obfuscated.js"></script> -->
    <!-- <script src="/libs/collet-data.js"></script> -->
    <script>
        setTimeout( function ()
        {
            window.__onemobDetect && window.__onemobDetect()
            window.__onemobLog && window.__onemobLog( '3秒检测完成' )
        }, 3000 )
    </script>
</body>
</html>
